name: visual-check

on:
  push:
    branches: ["main", "claude/**", "codex/**", "feat/**"]
    paths:
      - "ui/**"
      - "tools/**"
      - ".github/workflows/visual-check.yml"
  pull_request:
    paths:
      - "ui/**"
      - "tools/**"
      - ".github/workflows/visual-check.yml"
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check JavaScript and scroll arithmetic
        run: |
          node --check ui/app.js
          node --check ui/scroll-lab.js
          node --check ui/scroll-content.js
          node --check ui/tours.js
          node --test tools/scroll-input.test.js
          node --test tools/boards.test.js
          node --test tools/vial-layout.test.js

      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node tools/visual-check.js screenshots

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visual-check-screenshots
          path: screenshots/
          retention-days: 14
